<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A polished Hello World page" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8f7ff;
        --muted: #bbb9dc;
        --violet: #a78bfa;
        --pink: #f472b6;
        --cyan: #67e8f9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d0b1d;
      }

      .orb {
        position: absolute;
        border-radius: 999px;
        filter: blur(4px);
        opacity: .75;
        animation: drift 11s ease-in-out infinite alternate;
      }
      .orb.one { width: 26rem; height: 26rem; background: #5b21b6; top: -10rem; left: -7rem; }
      .orb.two { width: 21rem; height: 21rem; background: #be185d; bottom: -9rem; right: -4rem; animation-delay: -4s; }
      .orb.three { width: 13rem; height: 13rem; background: #0891b2; top: 15%; right: 12%; animation-delay: -7s; }

      main {
        position: relative;
        width: min(92vw, 48rem);
        padding: clamp(2.5rem, 7vw, 5.5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 2rem;
        background: linear-gradient(135deg, rgba(255,255,255,.15), rgba(255,255,255,.045));
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, .38), inset 0 1px rgba(255,255,255,.12);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: var(--cyan);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.75rem);
        line-height: .95;
        letter-spacing: -.075em;
        background: linear-gradient(110deg, #fff 15%, var(--cyan) 48%, var(--pink) 82%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 32rem;
        margin: 1.7rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.7;
      }

      .sparkles { margin-top: 2.15rem; font-size: 1.35rem; letter-spacing: .65rem; }

      @keyframes drift {
        to { transform: translate(2.5rem, 2rem) scale(1.1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .orb { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <main>
      <p class="eyebrow">A bright beginning</p>
      <h1>Hello, World!</h1>
      <p>Your first page, dressed up with luminous color, glassy depth, and a little bit of magic.</p>
      <div class="sparkles" aria-hidden="true">✦ ✧ ✦</div>
    </main>
  </body>
</html>
